<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>配色对比</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 40px;
    background: #f7f8fa;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #1b1d21;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; font-size: 13px; color: #6b7280; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
    gap: 24px;
  }
  .label { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .label b { font-size: 14px; }
  .label span { color: #6b7280; font-size: 12px; }
  .win {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(15, 23, 42, .10), 0 1px 3px rgba(15, 23, 42, .08);
    display: grid;
    grid-template-columns: 168px 1fr;
    height: 240px;
    border: 1px solid rgba(15, 23, 42, .06);
  }
  .side {
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--canvas);
    box-shadow: inset -1px 0 0 var(--line);
  }
  .brand { height: 10px; width: 70%; border-radius: 3px; background: var(--ink-soft); opacity: .55; margin-bottom: 6px; }
  .newbtn { height: 26px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
  .nav { height: 8px; border-radius: 3px; background: var(--ink-soft); opacity: .35; }
  .nav.short { width: 62%; }
  .row { height: 26px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
  .row.sel { background: var(--sel); }
  .main {
    background: var(--canvas);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    border-radius: 10px; background: var(--card);
    border: 1px solid var(--line);
    padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    display: flex; flex-direction: column; gap: 6px;
  }
  .line { height: 7px; border-radius: 3px; background: var(--ink-soft); opacity: .45; }
  .line.w1 { width: 88%; } .line.w2 { width: 64%; }
  .spacer { flex: 1; }
  .composer {
    border-radius: 12px; background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 6px 18px rgba(15, 23, 42, .08), inset 0 0 0 1px rgba(255,255,255,.6);
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .tools { display: flex; gap: 6px; align-items: center; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .chip { height: 14px; width: 44px; border-radius: 7px; background: var(--chip); }
  .hint { font-size: 12px; color: #9aa1ab; margin-top: 22px; }

  .p-sky {
    --canvas: #dfeafb; --card: #fbfdff; --line: rgba(90, 120, 170, .24);
    --ink-soft: #5f6f88; --sel: #cfdffa; --accent: #3b82f6; --chip: #e6eefb;
  }
  .p-violet {
    --canvas: #e8e6f6; --card: #fcfbff; --line: rgba(110, 100, 160, .24);
    --ink-soft: #6d6688; --sel: #dcd8f4; --accent: #7c6cf0; --chip: #ece9fa;
  }
  .p-mint {
    --canvas: #dff0e9; --card: #fbfefc; --line: rgba(80, 130, 115, .24);
    --ink-soft: #5e7a70; --sel: #cdeade; --accent: #2fa87f; --chip: #e2f3ec;
  }
  .p-apricot {
    --canvas: #f7ece1; --card: #fffdfb; --line: rgba(150, 115, 85, .24);
    --ink-soft: #7d6a58; --sel: #f3ddc9; --accent: #d08442; --chip: #f9ecdf;
  }
</style>
</head>
<body>
  <h1>四套带颜色的配色</h1>
  <p class="lead">底有明确色相，卡片近白——颜色来自底，卡片只负责「浮起来」。</p>
  <div class="grid">

    <div class="option">
      <div class="label"><b>天蓝</b><span>底 #dfeafb · 卡片 #fbfdff · 强调 #3b82f6</span></div>
      <div class="win p-sky">
        <div class="side">
          <div class="brand"></div><div class="newbtn"></div>
          <div class="nav"></div><div class="nav short"></div><div class="nav"></div>
          <div class="spacer"></div><div class="row sel"></div><div class="row"></div>
        </div>
        <div class="main">
          <div class="msg"><div class="line w1"></div><div class="line w2"></div></div>
          <div class="spacer"></div>
          <div class="composer">
            <div class="line w2"></div>
            <div class="tools"><div class="dot"></div><div class="chip"></div><div class="chip"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="option">
      <div class="label"><b>雾紫</b><span>底 #e8e6f6 · 卡片 #fcfbff · 强调 #7c6cf0</span></div>
      <div class="win p-violet">
        <div class="side">
          <div class="brand"></div><div class="newbtn"></div>
          <div class="nav"></div><div class="nav short"></div><div class="nav"></div>
          <div class="spacer"></div><div class="row sel"></div><div class="row"></div>
        </div>
        <div class="main">
          <div class="msg"><div class="line w1"></div><div class="line w2"></div></div>
          <div class="spacer"></div>
          <div class="composer">
            <div class="line w2"></div>
            <div class="tools"><div class="dot"></div><div class="chip"></div><div class="chip"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="option">
      <div class="label"><b>薄荷</b><span>底 #dff0e9 · 卡片 #fbfefc · 强调 #2fa87f</span></div>
      <div class="win p-mint">
        <div class="side">
          <div class="brand"></div><div class="newbtn"></div>
          <div class="nav"></div><div class="nav short"></div><div class="nav"></div>
          <div class="spacer"></div><div class="row sel"></div><div class="row"></div>
        </div>
        <div class="main">
          <div class="msg"><div class="line w1"></div><div class="line w2"></div></div>
          <div class="spacer"></div>
          <div class="composer">
            <div class="line w2"></div>
            <div class="tools"><div class="dot"></div><div class="chip"></div><div class="chip"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="option">
      <div class="label"><b>暖杏</b><span>底 #f7ece1 · 卡片 #fffdfb · 强调 #d08442</span></div>
      <div class="win p-apricot">
        <div class="side">
          <div class="brand"></div><div class="newbtn"></div>
          <div class="nav"></div><div class="nav short"></div><div class="nav"></div>
          <div class="spacer"></div><div class="row sel"></div><div class="row"></div>
        </div>
        <div class="main">
          <div class="msg"><div class="line w1"></div><div class="line w2"></div></div>
          <div class="spacer"></div>
          <div class="composer">
            <div class="line w2"></div>
            <div class="tools"><div class="dot"></div><div class="chip"></div><div class="chip"></div></div>
          </div>
        </div>
      </div>
    </div>

  </div>
  <p class="hint">选一个（或者给个色相，比如「偏紫一点」「偏奶油」），我把画布、卡片、壁纸、强调色一起换过去。</p>
</body>
</html>
