name: publish

# 发布流程（两种触发方式，任选其一）：
#   A. 打 tag 推送：git push origin v0.20.8
#      —— 不需要 GitHub API，纯 git 通道（SSH 也行），代理断了也能发
#   B. 在 GitHub 上建 Release，tag 用 v<version>
# 两种都会校验 tag 与 package.json 一致，然后发布到 npm。
#
# 也可以手动触发：Actions → publish → Run workflow。
# 需要仓库 secret：NPM_TOKEN 或 NPM（npm 的 Automation / 绕过 2FA 的 Granular token）。

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # tag 和 package.json 对不上就不发，避免发出一个版本号错误的包
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json = $pkg"
          echo "tag          = $tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::版本号不一致：package.json 是 $pkg，tag 是 $tag"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          # 仓库里这个 secret 可能叫 NPM，也可能叫 NPM_TOKEN——两个都认，
          # 免得因为名字不一致拿到空值报 ENEEDAUTH。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM }}
