<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>维护中心弹窗预览</title>
<style>
  :root {
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-bg-layer-1: #f6f7f9;
    --dsw-alias-bg-layer-2: #eef0f4;
    --dsw-alias-border-l1: #e3e6ec;
    --dsw-alias-border-l2: #d5d9e2;
    --dsw-alias-label-primary: #14171c;
    --dsw-alias-label-secondary: #6b7280;
    --dsw-alias-brand-primary: #4f6ef7;
    --dsw-alias-state-success-primary: #16a34a;
    --dsw-alias-state-warn-primary: #d97706;
    --dsw-alias-state-error-primary: #dc2626;
  }
  body {
    margin: 0;
    padding: 40px;
    background: linear-gradient(180deg, #e9ecf2, #f4f5f8);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #14171c;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .note { font-size: 12px; color: #6b7280; margin: 0 0 28px; }
  .stage { position: relative; height: 150px; margin-bottom: 34px; }
  .fake-chat {
    position: absolute; inset: 0 0 0 0; border-radius: 14px;
    border: 1px solid #dfe3ea; background: #fff; overflow: hidden;
  }
  .fake-chat::before {
    content: "对话内容"; position: absolute; left: 24px; top: 22px;
    font-size: 13px; color: #9aa1ac;
  }
  .fake-chat::after {
    content: ""; position: absolute; left: 24px; top: 52px; right: 40%;
    height: 8px; border-radius: 4px; background: #eef0f4;
    box-shadow: 0 22px 0 #eef0f4, 0 44px 0 #eef0f4;
  }
  /* ---- 以下就是插件里的 BANNER_CSS（原样） ---- */
  .uc-banner{position:absolute;top:10px;right:10px;left:auto;transform:none;width:min(376px,calc(100vw - 28px));z-index:9999;pointer-events:auto;display:flex;flex-direction:column;gap:9px;padding:12px 13px 12px 16px;border:1px solid var(--dsw-alias-border-l2);border-radius:14px;background:var(--dsw-alias-bg-overlay);color:var(--dsw-alias-label-primary);box-shadow:0 14px 34px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.08);font-size:12px;line-height:1.45;}
  .uc-banner::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--dsw-alias-state-success-primary);}
  .uc-banner-error::before{background:var(--dsw-alias-state-error-primary);}
  .uc-banner-update::before{background:var(--dsw-alias-state-warn-primary);}
  .uc-banner-top{display:flex;align-items:flex-start;gap:10px;}
  .uc-banner-icon{flex:none;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-state-success-primary);}
  .uc-banner-error .uc-banner-icon{color:var(--dsw-alias-state-error-primary);}
  .uc-banner-update .uc-banner-icon{color:var(--dsw-alias-state-warn-primary);}
  .uc-banner-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .uc-banner-title{font-weight:600;font-size:12.5px;}
  .uc-banner-detail{color:var(--dsw-alias-label-secondary);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .uc-banner-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;}
  .uc-banner-hint{color:var(--dsw-alias-label-secondary);font-size:11px;margin-right:auto;}
  .uc-banner-action{appearance:none;border:1px solid transparent;background:transparent;color:var(--dsw-alias-label-secondary);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;}
  .uc-banner-action:hover{background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary);}
  .uc-banner-action-primary{background:var(--dsw-alias-brand-primary);border-color:var(--dsw-alias-brand-primary);color:#fff;font-weight:600;}
  .uc-banner-progress{padding-bottom:18px;}
  .uc-banner-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--dsw-alias-border-l1);border-radius:0 0 14px 14px;overflow:hidden;}
  .uc-banner-bar-fill{height:100%;background:var(--dsw-alias-brand-primary);}
</style>
</head>
<body>
  <h1>维护中心 · 弹窗三种状态</h1>
  <p class="note">位置：窗口右上角，宽 376px。下面的浅灰方块代表对话区域，弹窗不压住它。</p>

  <div class="stage">
    <div class="fake-chat"></div>
    <div class="uc-banner">
      <div class="uc-banner-top">
        <span class="uc-banner-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <div class="uc-banner-copy">
          <div class="uc-banner-title">插件更新完成 · 2 个插件</div>
          <div class="uc-banner-detail">dsh-session-manager 0.7.10 → 0.7.11 · dshmarket 1.73.2 → 1.73.25</div>
        </div>
      </div>
      <div class="uc-banner-actions">
        <span class="uc-banner-hint">刷新后生效</span>
        <button class="uc-banner-action uc-banner-action-primary">刷新界面</button>
        <button class="uc-banner-action">知道了</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="fake-chat"></div>
    <div class="uc-banner uc-banner-update">
      <div class="uc-banner-top">
        <span class="uc-banner-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </span>
        <div class="uc-banner-copy">
          <div class="uc-banner-title">更新完成，需要重启</div>
          <div class="uc-banner-detail">dsh-session-manager 0.7.10 → 0.7.11</div>
        </div>
      </div>
      <div class="uc-banner-actions">
        <span class="uc-banner-hint">重启 DSH 后生效</span>
        <button class="uc-banner-action uc-banner-action-primary">重启应用</button>
        <button class="uc-banner-action">知道了</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="fake-chat"></div>
    <div class="uc-banner uc-banner-update uc-banner-progress">
      <div class="uc-banner-top">
        <span class="uc-banner-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
        </span>
        <div class="uc-banner-copy">
          <div class="uc-banner-title">正在下载更新</div>
          <div class="uc-banner-detail">0.2.2-rc.5 · 42%</div>
        </div>
      </div>
      <div class="uc-banner-bar"><div class="uc-banner-bar-fill" style="width:42%"></div></div>
    </div>
  </div>

  <p class="note">成功提示 20 秒后自动消失；带「重启应用」的提示会一直留着，直到点掉。</p>
</body>
</html>
