<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>维护中心布局预览</title>
<style>
  :root {
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #eef0f4;
    --dsw-alias-border-l1: #e3e6ec;
    --dsw-alias-border-l2: #d5d9e2;
    --dsw-alias-label-primary: #14171c;
    --dsw-alias-label-secondary: #6b7280;
    --uc-accent: #4f6ef7;
  }
  body { margin: 0; padding: 28px; background: #f2f4f8; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #14171c; }
  .dialog { max-width: 1150px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px 32px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .uc-root { display: flex; flex-direction: column; gap: 20px; max-width: 720px; padding: 10px 0 40px; font-size: 13px; }
  .uc-head { display: flex; flex-direction: column; gap: 4px; }
  .uc-title { margin: 0; font-size: 21px; font-weight: 650; }
  .uc-sub { margin: 0; font-size: 12px; color: #6b7280; }
  .uc-shell { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 14px; align-items: start; }
  .uc-rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 4px; padding-right: 10px; border-right: 1px solid #e3e6ec; }
  .uc-tab { width: 100%; text-align: left; padding: 9px 12px; border-radius: 9px; border: none; background: transparent; font-size: 13px; color: #6b7280; cursor: pointer; font-family: inherit; }
  .uc-tab:hover { background: #eef0f4; }
  .uc-tab[data-active="true"] { background: #eef0f4; color: #4f6ef7; font-weight: 600; box-shadow: inset 2px 0 0 #4f6ef7; }
  .uc-pane { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .uc-card { border: 1px solid #e3e6ec; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .uc-card-head { padding: 16px 20px 12px; font-weight: 600; font-size: 13.5px; }
  .uc-row { display: flex; justify-content: space-between; padding: 13px 20px; border-top: 1px solid #eef0f4; }
  .uc-muted { color: #6b7280; }
</style>
</head>
<body>
  <div class="dialog">
    <div class="uc-root">
      <div class="uc-head">
        <div class="uc-kicker" style="font-size:11px;color:#6b7280;margin-bottom:6px;">应用本体</div>
        <h1 class="uc-title">维护中心</h1>
        <p class="uc-sub">更新应用与插件，顺便盯着聊天性能</p>
      </div>
      <div class="uc-shell">
        <nav class="uc-rail">
          <button class="uc-tab">更新</button>
          <button class="uc-tab" data-active="true">插件</button>
          <button class="uc-tab">工具</button>
          <button class="uc-tab">性能</button>
          <button class="uc-tab">打字机</button>
          <button class="uc-tab">关于</button>
        </nav>
        <div class="uc-pane">
          <section class="uc-card">
            <div class="uc-card-head">插件</div>
            <div class="uc-row"><span>@xmanrui/dsh-im</span><span class="uc-muted">5.10.0 最新</span></div>
            <div class="uc-row"><span>dsh-better-sidebar</span><span class="uc-muted">0.32.1 最新</span></div>
            <div class="uc-row"><span>dshmarket</span><span class="uc-muted">1.74.0 最新</span></div>
          </section>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
